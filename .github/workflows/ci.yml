name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  pull_request:
    paths-ignore: ['**/*.md']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # Windows: the app is used and tested on Windows (Arial metrics, installed Chrome for Playwright).
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: prototype
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prototype/package-lock.json
      - run: npm ci
      # Private evidence must never be tracked (AGENTS.md); fail before anything else runs.
      - name: Private material guard
        shell: bash
        working-directory: .
        run: |
          if git ls-files | grep -E '\.private\.json$|^evidence-private/'; then
            echo "Private evidence is tracked"; exit 1
          fi
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            prototype/playwright-report
            prototype/test-results
          if-no-files-found: ignore
          retention-days: 7
