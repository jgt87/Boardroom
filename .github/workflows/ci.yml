name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  pull_request:
    paths-ignore: ['**/*.md']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # Windows: the app is used and tested on Windows (Arial metrics, installed Chrome for Playwright).
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: prototype
    steps:
      # Node 24 action runtimes (Node 20 is deprecated on GitHub runners). SHAs looked up with gh api, 2026-11-08.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prototype/package-lock.json
      - run: npm ci
      # Private evidence must never be tracked (AGENTS.md); fail before anything else runs.
      - name: Private material guard
        shell: bash
        working-directory: .
        run: |
          if git ls-files | grep -E '\.private\.json$|^evidence-private/'; then
            echo "Private evidence is tracked"; exit 1
          fi
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            prototype/playwright-report
            prototype/test-results
          if-no-files-found: ignore
          retention-days: 7
